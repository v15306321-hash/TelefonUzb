# Nightly full backup of the production database (catalog, settings, admin, and photos/video
# stored in PostgreSQL). The dump is encrypted (AES-256) and kept as a workflow artifact for 30 days.
#
# One-time setup — GitHub → repository → Settings → Secrets and variables → Actions → New repository secret:
#   DATABASE_URL       the Neon connection string (same value as on Render)
#   BACKUP_PASSPHRASE  any long password; keep it somewhere safe — it is needed to open the backups
#
# Restore: download the artifact, then
#   gpg --decrypt telefonuzb-*.dump.gpg > db.dump
#   pg_restore --clean --if-exists --no-owner -d "$DATABASE_URL" db.dump
name: Database backup

on:
  schedule:
    - cron: "37 21 * * *" # every day at 02:37 Tashkent time (UTC+5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add repository secrets DATABASE_URL and BACKUP_PASSPHRASE (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Install PostgreSQL client 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump database
        run: |
          # pg_dump needs a direct (non-pooled) connection: drop Neon's "-pooler" host suffix
          URL="${DATABASE_URL/-pooler./.}"
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --compress=9 --no-owner --no-privileges "$URL" -f db.dump
          /usr/lib/postgresql/18/bin/pg_restore --list db.dump > /dev/null   # sanity check: archive is readable
          echo "Dump size: $(du -h db.dump | cut -f1)"

      - name: Encrypt
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "telefonuzb-$STAMP.dump.gpg" db.dump <<< "$BACKUP_PASSPHRASE"
          shred -u db.dump

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: telefonuzb-db-${{ env.STAMP }}
          path: telefonuzb-*.dump.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
